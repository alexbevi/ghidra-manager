name: Real integration

on:
  workflow_dispatch:

jobs:
  sync:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --locked --group dev
      - name: Exercise managed installation
        env:
          GHIDRA_MANAGER_HOME: ${{ runner.temp }}/ghidra-manager
        run: |
          uv run ghidra-manager sync --dry-run
          uv run ghidra-manager sync
          uv run ghidra-manager sync
          uv run ghidra-manager status
          uv run ghidra-manager bridge --help
