[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ghidra-manager"
version = "0.1.0"
description = "Cross-platform manager for compatible Ghidra and GhidraMCP installations"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
  "psutil>=7.0,<8",
]

[project.scripts]
ghidra-manager = "ghidra_manager.cli:main"

[dependency-groups]
dev = [
  "mypy>=1.16,<2",
  "pytest>=8.4,<9",
  "ruff>=0.12,<1",
  "types-psutil>=7.0,<8",
]

[tool.hatch.build.targets.wheel]
packages = ["src/ghidra_manager"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"
exclude = ["src/ghidra_manager/compare.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.13"
strict = true
packages = ["ghidra_manager"]

[[tool.mypy.overrides]]
module = "ghidra_manager.compare"
ignore_errors = true
