[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ghidra-manager"
version = "0.2.1"
description = "Cross-platform manager for compatible Ghidra and GhidraMCP installations"
readme = "README.md"
requires-python = ">=3.13,<3.14"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  { name = "Alex Bevilacqua" },
]
keywords = ["ghidra", "reverse-engineering", "binary-analysis", "mcp"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: MacOS",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.13",
]
dependencies = [
  "psutil>=7.0,<8",
]

[project.scripts]
ghidra-manager = "ghidra_manager.cli:main"

[project.urls]
Homepage = "https://github.com/alexbevi/ghidra-manager"
Repository = "https://github.com/alexbevi/ghidra-manager.git"
Issues = "https://github.com/alexbevi/ghidra-manager/issues"
Changelog = "https://github.com/alexbevi/ghidra-manager/releases"

[dependency-groups]
dev = [
  "mypy>=1.16,<2",
  "pytest>=8.4,<9",
  "ruff>=0.12,<1",
  "types-psutil>=7.0,<8",
]

[tool.hatch.build.targets.wheel]
packages = ["src/ghidra_manager"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"
exclude = ["src/ghidra_manager/compare.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.13"
strict = true
packages = ["ghidra_manager"]

[[tool.mypy.overrides]]
module = "ghidra_manager.compare"
ignore_errors = true
